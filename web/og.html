<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1200,initial-scale=1">
<title>Hi-Lo Royale — social card 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#050608;overflow:hidden}
#card{position:absolute;top:0;left:0;width:1200px;height:630px;background:#050608;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;color:#f4f7fb}

/* glows */
.glow{position:absolute;border-radius:50%;filter:blur(2px)}
#glow-gold{top:-320px;left:-220px;width:760px;height:760px;background:radial-gradient(circle,rgba(255,213,74,.20) 0%,rgba(255,213,74,.06) 45%,rgba(255,213,74,0) 70%)}
#glow-cyan{bottom:-340px;right:-240px;width:820px;height:820px;background:radial-gradient(circle,rgba(46,230,255,.16) 0%,rgba(46,230,255,.05) 45%,rgba(46,230,255,0) 70%)}
#glow-red{top:-260px;right:-160px;width:560px;height:560px;background:radial-gradient(circle,rgba(255,59,92,.12) 0%,rgba(255,59,92,0) 65%)}
#grid{position:absolute;top:0;left:0;width:1200px;height:630px;background:
  repeating-linear-gradient(0deg,rgba(28,36,51,.35) 0 1px,transparent 1px 60px),
  repeating-linear-gradient(90deg,rgba(28,36,51,.35) 0 1px,transparent 1px 60px)}
#vignette{position:absolute;top:0;left:0;width:1200px;height:630px;background:radial-gradient(ellipse 900px 520px at 600px 300px,transparent 55%,rgba(5,6,8,.85) 100%)}

/* frame ticks (ticket feel) */
.tick{position:absolute;background:#334057}
#tick-tl-h{top:36px;left:36px;width:34px;height:2px}#tick-tl-v{top:36px;left:36px;width:2px;height:34px}
#tick-tr-h{top:36px;right:36px;width:34px;height:2px}#tick-tr-v{top:36px;right:36px;width:2px;height:34px}
#tick-bl-h{bottom:36px;left:36px;width:34px;height:2px}#tick-bl-v{bottom:36px;left:36px;width:2px;height:34px}
#tick-br-h{bottom:36px;right:36px;width:34px;height:2px}#tick-br-v{bottom:36px;right:36px;width:2px;height:34px}

/* crown */
#crown{position:absolute;top:74px;left:558px;width:84px;height:84px;filter:drop-shadow(0 0 26px rgba(255,213,74,.55))}

/* wordmark */
#title{position:absolute;top:168px;left:0;width:1200px;text-align:center;font-family:"Cabinet Grotesk","DM Sans",sans-serif;font-weight:900;font-style:italic;font-size:118px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
#title .g{color:#ffd54a;text-shadow:0 0 52px rgba(255,213,74,.45)}

/* tagline */
#tag{position:absolute;top:318px;left:0;width:1200px;text-align:center;font-size:34px;font-weight:600;color:#f4f7fb;letter-spacing:.01em}
#tag b{color:#ffd54a;font-weight:700}

/* HI / LO chips */
.chip{position:absolute;top:398px;width:170px;height:64px;border-radius:16px;background:rgba(7,9,13,.82);text-align:center;line-height:60px;font-family:"Cabinet Grotesk","DM Sans",sans-serif;font-weight:900;font-style:italic;font-size:30px;letter-spacing:.06em}
#chip-hi{left:416px;border:2px solid #2ee6ff;color:#2ee6ff;box-shadow:0 0 30px rgba(46,230,255,.28)}
#chip-lo{left:614px;border:2px solid #ff3b5c;color:#ff3b5c;box-shadow:0 0 30px rgba(255,59,92,.28)}
.chip svg{width:22px;height:22px;vertical-align:-2px;margin-right:10px}

/* divider + footer */
#rule{position:absolute;top:522px;left:200px;width:800px;height:1px;background:linear-gradient(90deg,rgba(51,64,87,0),#334057 20%,#334057 80%,rgba(51,64,87,0))}
#foot{position:absolute;top:552px;left:0;width:1200px;text-align:center;font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#93a1b5;white-space:nowrap}
#foot .dot{color:#ffd54a;padding:0 18px}
</style></head>
<body>
<div id="card">
  <div class="glow" id="glow-gold"></div>
  <div class="glow" id="glow-cyan"></div>
  <div class="glow" id="glow-red"></div>
  <div id="grid"></div>
  <div id="vignette"></div>

  <div class="tick" id="tick-tl-h"></div><div class="tick" id="tick-tl-v"></div>
  <div class="tick" id="tick-tr-h"></div><div class="tick" id="tick-tr-v"></div>
  <div class="tick" id="tick-bl-h"></div><div class="tick" id="tick-bl-v"></div>
  <div class="tick" id="tick-br-h"></div><div class="tick" id="tick-br-v"></div>

  <svg id="crown" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 7l4 4 5-7 5 7 4-4-1.5 12H4.5L3 7z" fill="#ffd54a"/>
  </svg>

  <div id="title">HI-LO <span class="g">ROYALE</span></div>

  <div id="tag">100 fans enter. <b>One survives the stats.</b></div>

  <div class="chip" id="chip-hi">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>HI
  </div>
  <div class="chip" id="chip-lo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ff3b5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>LO
  </div>

  <div id="rule"></div>
  <div id="foot">real World Cup data<span class="dot">&middot;</span>provable on Solana</div>
</div>
</body></html>
